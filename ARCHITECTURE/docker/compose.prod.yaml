# DOCKER-COMPOSE FILE : PROD ENVIRONMENT (Swarm)
version: "3.8"

services:

  # BACKEND API
  backend-api-service:
    image: lo10/backend-api:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    depends_on:
      - redis-service
    env_file:
      - ../../BACKEND_API/.env
    environment:
      DEBUG: "False"
      REDIS_HOST: redis-service
      REDIS_PORT: "6379"
    networks:
      - template-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # FRONTEND
  frontend-service:
    image: lo10/frontend:latest
    env_file:
      - ../../FRONTEND/.env
    depends_on:
      - postgres-service
      - redis-service
    networks:
      - template-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # CACHE
  redis-service:
    image: redis:7-alpine
    networks:
      - template-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # DATABASE
  postgres-service:
    image: postgres:15.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: application_database
    volumes:
      - postgres_service_data:/var/lib/postgresql/data
      - ../init-scripts/postgres-init-script.sql:/docker-entrypoint-initdb.d/postgres-init-script.sql:ro
    networks:
      - template-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # DB UI
  adminer-wannago:
    image: adminer
    ports:
      - "8090:8080"
    depends_on:
      - postgres-service
    networks:
      - template-network
    deploy:
      replicas: 1

  # Reverse Proxy
  nginx-service:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx_conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx_conf/conf.d:/etc/nginx/conf.d:ro
      # Uncomment and mount your SSL certificates to enable HTTPS:
      # - ../nginx_conf/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-service
    networks:
      - template-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

networks:
  template-network:
    driver: overlay

volumes:
  postgres_service_data:
